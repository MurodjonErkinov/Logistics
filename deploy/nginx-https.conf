server {
    listen 80;
    server_name logistics.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/logistics-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name logistics.example.com;
    ssl_certificate /etc/letsencrypt/live/logistics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=3600" always;
    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
