services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - postgres_custom_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_PORT:-8018}:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_custom_user_data:
