services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - postgres_custom_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    image: logistics-web
    env_file: .env
    environment:
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},web"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_PORT:-8018}:8000"
    depends_on:
      db:
        condition: service_healthy
  telegram_cleanup:
    image: logistics-web
    restart: unless-stopped
    env_file: .env
    command: python manage.py telegram_cleanup --watch
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
  driver_worker:
    image: logistics-web
    restart: unless-stopped
    env_file: .env
    command: python manage.py driver_worker
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
  driver_bot:
    image: logistics-web
    restart: unless-stopped
    profiles: ["driver-bot"]
    env_file: .env
    command: python manage.py driver_bot
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
  frontend:
    build: ./frontend
    profiles: ["frontend"]
    restart: unless-stopped
    environment:
      BACKEND_URL: http://web:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3018}:3000"
    depends_on:
      - web
  telegram_importer:
    image: logistics-web
    restart: unless-stopped
    profiles: ["telegram"]
    env_file: .env
    environment:
      TELEGRAM_AI_PROVIDER: ${TELEGRAM_AI_PROVIDER:-openai}
    command: python manage.py telegram_watch
    volumes:
      - .:/app
      - telegram_session:/app/.telegram_session
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_custom_user_data:
  telegram_session:
